<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nöbetçi Takip</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            margin: 0; 
            padding: 15px; 
            color: #2c3e50; 
            min-height: 100vh;
        }
        .container { 
            max-width: 450px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 25px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            backdrop-filter: blur(10px);
        }
        h1 { text-align: center; color: #1a252f; font-size: 22px; font-weight: 800; margin-bottom: 5px; }
        h2 { text-align: center; color: #3498db; font-size: 14px; font-weight: 600; margin-top: 0; margin-bottom: 20px; letter-spacing: 1px;}
        
        .saat-kapsayici { text-align: center; margin-bottom: 25px; }
        .canli-saat { background: #fff; color: #2c3e50; padding: 8px 20px; border-radius: 25px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: inline-block; border: 1px solid #eee;}
        
        .box { 
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%); 
            color: #fff; 
            padding: 25px 20px; 
            border-radius: 20px; 
            text-align: center; 
            margin-bottom: 15px; 
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.3);
            position: relative;
            overflow: hidden;
        }
        .nobetci-isim { font-size: 38px; font-weight: 800; color: #f1c40f; display: block; margin: 5px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .durum-etiketi { font-size: 12px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 10px; display: inline-block; margin-top: 5px;}
        
        .next-box { background: #fff; padding: 15px; border-radius: 15px; border-left: 5px solid #e67e22; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; font-size: 15px; margin-bottom: 25px; }
        .next-box b { color: #e67e22; font-size: 18px; }

        .btn-grup { display: flex; gap: 10px; margin-bottom: 20px; }
        button { 
            flex: 1; 
            border: none; 
            padding: 15px 10px; 
            border-radius: 15px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 800; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-family: 'Poppins', sans-serif;
        }
        button:active { transform: scale(0.95); }
        .btn-gelmedi { background: #ffeaa7; color: #d63031; border: 2px solid #ff7675; }
        .btn-tamam { background: #55efc4; color: #00b894; border: 2px solid #00cec9; font-size: 15px;}
        
        .bildirim-btn { width: 100%; background: #dfe6e9; color: #2d3436; margin-bottom: 25px; border: 1px dashed #b2bec3; box-shadow: none;}

        .history-title { font-size: 15px; font-weight: 800; color: #2c3e50; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item { background: #fff; padding: 12px 15px; border-radius: 12px; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; border-left: 4px solid #bdc3c7;}
        .history-item small { color: #95a5a6; font-size: 11px; font-weight: 400; display: block; margin-top: 3px;}
        .badge { padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase;}
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <h1>ANKARA ŞEKER FABRİKASI</h1>
    <h2>TEPHİRLER NÖBET LİSTESİ</h2>

    <div class="saat-kapsayici">
        <span id="saatTarih" class="canli-saat">Yükleniyor...</span>
    </div>

    <!-- Bildirim İzin Butonu -->
    <button class="bildirim-btn" id="bildirimIzinBtn" onclick="bildirimIzinIste()">🔔 Bildirimleri Aç</button>

    <div class="box">
        <div style="font-size: 13px; opacity: 0.9; font-weight: 600;">ŞU ANKİ NÖBETÇİ</div>
        <span id="bugunKisi" class="nobetci-isim">...</span>
        <div id="durumBilgi" class="durum-etiketi">Bağlanıyor...</div>
    </div>

    <div class="next-box">
        Sonraki Nöbetçi: <b><span id="sonrakiKisi">...</span></b>
    </div>

    <div class="btn-grup">
        <button class="btn-gelmedi" onclick="gelmediIsaretle()">❌ GELMEDİ</button>
        <button class="btn-tamam" onclick="tamamlandiIsaretle()">✅ TAMAMLANDI</button>
    </div>

    <div class="history-title">
        <span>Geçmiş İşlemler</span>
    </div>
    <ul id="gecmisListesi" class="history-list"></ul>
</div>

<script>
    // --- Canlı Saat ---
    function saatiGuncelle() {
        const simdi = new Date();
        const ayarlar = { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit', second:'2-digit' };
        document.getElementById("saatTarih").textContent = simdi.toLocaleDateString('tr-TR', ayarlar);
    }
    setInterval(saatiGuncelle, 1000);
    saatiGuncelle();

    // --- Bildirim Sistemi ---
    function bildirimIzinIste() {
        if (!("Notification" in window)) {
            alert("Tarayıcınız bildirimleri desteklemiyor.");
            return;
        }
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                document.getElementById("bildirimIzinBtn").style.display = "none";
                new Notification("Sistem Aktif", { body: "Nöbet bildirimleri başarıyla açıldı!" });
            } else {
                alert("Bildirimlere izin vermediğiniz için uyarı alamazsınız.");
            }
        });
    }

    // Sayfa açıldığında izin verilmişse butonu gizle
    if ("Notification" in window && Notification.permission === "granted") {
        document.getElementById("bildirimIzinBtn").style.display = "none";
    }

    function bildirimGonder(mesaj) {
        if ("Notification" in window && Notification.permission === "granted") {
            new Notification("Tephirler Nöbet Değişimi", { body: mesaj });
        }
    }

    // --- Firebase Ayarları ---
    const firebaseConfig = {
        apiKey: "AIzaSyCx5Nq4PxLi_STqsUzQkKGLqnriLBkpZeA",
        authDomain: "tephirlernobet.firebaseapp.com",
        databaseURL: "https://tephirlernobet-default-rtdb.firebaseio.com",
        projectId: "tephirlernobet",
        storageBucket: "tephirlernobet.firebasestorage.app",
        messagingSenderId: "975828220326",
        appId: "1:975828220326:web:04e3353e9e002203ccf767"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const nobetRef = db.ref('nobetSistemi/guncelData');

    const anaListe = ["SERKAN", "TURAN", "MEVLÜT", "OSMAN", "AHMET", "ERTUĞRUL", "SİRAÇ"];

    let veri = {
        currentIndex: 0,
        gelmeyenler: [],
        gecmis: [],
        aktifIsim: "SERKAN",
        aktifTip: "normal",
        sonIslemMesaji: ""
    };

    let ilkYukleme = true;

    function ekraniGuncelle() {
        document.getElementById("bugunKisi").textContent = veri.aktifIsim;
        
        let sonraki = "";
        if (veri.aktifTip === "normal") {
            sonraki = (veri.gelmeyenler && veri.gelmeyenler.length > 0) ? veri.gelmeyenler[0] : anaListe[(veri.currentIndex + 1) % anaListe.length];
        } else {
            sonraki = (veri.gelmeyenler && veri.gelmeyenler.length > 1) ? veri.gelmeyenler[1] : anaListe[veri.currentIndex];
        }
        document.getElementById("sonrakiKisi").textContent = sonraki;

        document.getElementById("durumBilgi").innerHTML = (veri.aktifTip === "telafi") ? "⚠️ Önceki nöbetinden kalan hak" : "Normal Sıra";

        const listeEl = document.getElementById("gecmisListesi");
        listeEl.innerHTML = "";
        
        if(veri.gecmis && veri.gecmis.length > 0) {
            veri.gecmis.slice(-6).reverse().forEach(item => {
                let li = document.createElement("li");
                li.className = "history-item";
                let renk = item.durum === 'Gelmedi' ? 'color:#d63031; background:#ffeaa7;' : 'color:#00b894; background:#55efc4;';
                let borderRenk = item.durum === 'Gelmedi' ? '#e74c3c' : '#27ae60';
                li.style.borderLeftColor = borderRenk;
                li.innerHTML = `<span>${item.isim} <small>${item.tarih}</small></span> <span class="badge" style="${renk}">${item.durum}</span>`;
                listeEl.appendChild(li);
            });
        }
    }

    nobetRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            veri = data;
            if(!veri.gelmeyenler) veri.gelmeyenler = [];
            if(!veri.gecmis) veri.gecmis = [];
            
            // Eğer veritabanında yeni bir işlem mesajı varsa ve ilk yükleme değilse bildirim at
            if (!ilkYukleme && veri.sonIslemMesaji) {
                bildirimGonder(veri.sonIslemMesaji);
            }
        } else {
            nobetRef.set(veri);
        }
        ekraniGuncelle();
        ilkYukleme = false;
    });

    window.gelmediIsaretle = function() {
        if (!confirm("DİKKAT: " + veri.aktifIsim + " gelmedi olarak işaretlenecek. Emin misin?")) return;

        const tarihSaat = new Date().toLocaleDateString('tr-TR') + " " + new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
        veri.gecmis.push({ tarih: tarihSaat, isim: veri.aktifIsim, durum: "Gelmedi" });
        
        let eskiIsim = veri.aktifIsim;

        if (veri.aktifTip === "normal") {
            veri.gelmeyenler.push(veri.aktifIsim); 
            veri.currentIndex = (veri.currentIndex + 1) % anaListe.length;
        } else {
            let yineGelmeyen = veri.gelmeyenler.shift();
            veri.gelmeyenler.push(yineGelmeyen);
        }

        veri.aktifIsim = anaListe[veri.currentIndex];
        veri.aktifTip = "normal";
        
        veri.sonIslemMesaji = eskiIsim + " nöbete gelmedi. Yeni nöbetçi: " + veri.aktifIsim;
        nobetRef.set(veri);
    }

    window.tamamlandiIsaretle = function() {
        if (!confirm("ONAY: " + veri.aktifIsim + " nöbeti tamamladı. Devam edilsin mi?")) return;

        const tarihSaat = new Date().toLocaleDateString('tr-TR') + " " + new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
        veri.gecmis.push({ tarih: tarihSaat, isim: veri.aktifIsim, durum: "Tamamlandı" });
        
        let eskiIsim = veri.aktifIsim;

        if (veri.aktifTip === "telafi") {
            veri.gelmeyenler.shift(); 
        } else {
            veri.currentIndex = (veri.currentIndex + 1) % anaListe.length; 
        }
        
        if (veri.gelmeyenler.length > 0) {
            veri.aktifIsim = veri.gelmeyenler[0];
            veri.aktifTip = "telafi";
        } else {
            veri.aktifIsim = anaListe[veri.currentIndex];
            veri.aktifTip = "normal";
        }
        
        veri.sonIslemMesaji = eskiIsim + " nöbeti tamamladı. Sıra sende olabilir, yeni nöbetçi: " + veri.aktifIsim;
        nobetRef.set(veri);
    }
</script>

</body>
</html>
